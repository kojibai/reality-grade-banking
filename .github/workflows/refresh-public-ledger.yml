name: Refresh public Ledger snapshot

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ledger-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Capture the already published financial history
        id: capture
        run: |
          node scripts/refresh-public-ledger-seed.mjs
          if git diff --quiet -- public/receiz-public-ledger.json.gz.bin; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the public history and Analytics operands
        if: steps.capture.outputs.changed == 'true'
        run: npm test -- --maxWorkers=1 tests/public-ledger-seed-refresh.test.ts tests/analytics-trades.test.ts
      - name: Publish one data-only successor
        if: steps.capture.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/public-ledger-snapshot.json"
          import {readFileSync} from 'node:fs';
          const path='public/receiz-public-ledger.json.gz.bin';
          const input={
            branch:{repositoryNameWithOwner:process.env.GITHUB_REPOSITORY,refName:'refs/heads/main'},
            expectedHeadOid:process.env.GITHUB_SHA,
            message:{headline:'Refresh the public Ledger snapshot'},
            fileChanges:{additions:[{path,contents:readFileSync(path).toString('base64')}]},
          };
          const query='mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}';
          process.stdout.write(JSON.stringify({query,variables:{input}}));
          NODE
          gh api graphql --input "$RUNNER_TEMP/public-ledger-snapshot.json" --jq '.data.createCommitOnBranch.commit.oid'
