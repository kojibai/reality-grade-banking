name: Verify reference

on:
  push:
    branches: [main, feat/receiz-bank]
  pull_request:

permissions:
  contents: read

concurrency:
  group: reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  build_verify:
    name: Build, browser and source verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Use preinstalled Chrome for browser checks
        run: |
          browser_path="$(command -v google-chrome)"
          "$browser_path" --version
          echo "BANK_BROWSER_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run release:check
      - run: npm run typecheck
      - run: npm run receiver:check
      - run: npm run native:check
      - run: npm run native:rebuild -- --sdk
      - run: npm run build
      - run: npm run test:browser
      - run: npm run test:vault-browser
      - name: Retain browser regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-regressions
          path: test-results/browser-regressions/
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run source:verify -- --rebuild

  # Keep the existing required check name. Both independent jobs must pass;
  # always() prevents an upstream failure or cancellation from hiding this gate.
  verify:
    needs: [tests, build_verify]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every verification job to pass
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build_verify.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
