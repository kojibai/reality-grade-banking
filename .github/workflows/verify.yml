name: Verify reference

on:
  push:
    branches: [main, feat/receiz-bank]
  pull_request:

permissions:
  contents: read

concurrency:
  group: reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run receiver:check
      - run: npm run native:check
      - run: npm run native:rebuild -- --sdk
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Retain browser regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-regressions
          path: test-results/browser-regressions/
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run source:verify -- --rebuild
