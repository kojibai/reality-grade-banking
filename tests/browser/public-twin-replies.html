<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Public Twin reply verification</title><link rel="stylesheet" href="/learn/learn.css"><link rel="stylesheet" href="/learn/cooperatives.css"><style>body{margin:0;background:#fbfcfe;color:#172b45;font-family:Inter,Arial,sans-serif}main{max-width:1040px;margin:auto;padding:28px 20px}main>small{display:block;font-size:11px;color:#7086a0;margin-bottom:24px}</style></head><body><main class="cooperative-suite"><small>Synthetic UI verification · no live Twin, contact, appointment or payment</small><div id="chat"></div></main><script type="module">
import {cooperativeConversation} from '/scripts/twin-conversation.mjs';
