<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; worker-src blob:"><title>Offline proof inspection</title><style>body{max-width:850px;margin:50px auto;padding:20px;font:16px/1.6 system-ui;color:#183047}input,button{font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fa;padding:20px}label{display:block;margin:20px 0}</style><h1>Offline proof inspection</h1><p>Select the original and compare its SHA-256 with record.json or the independently obtained digest. Select record.json to check a Wallet capsule’s hash consistency. No network requests are permitted by this page.</p><label>Original or record JSON <input type="file" id="file"></label><label>Expected original SHA-256 <input id="digest" size="64" autocomplete="off" spellcheck="false"></label><button id="inspect">Inspect locally</button><pre id="result" role="status">Ready.</pre><script src="verifier.js"></script><script>
 document.getElementById('inspect').onclick=async()=>{
 const output=document.getElementById('result'),file=document.getElementById('file').files[0];if(!file){output.textContent='Choose a file.';return;}output.textContent='Verifying locally…';
 try{if(file.size<=0||file.size>24*1024*1024)throw Error('PROOF_INSPECTION_CAPACITY');const bytes=new Uint8Array(await file.arrayBuffer()),expected=document.getElementById('digest').value.trim(),v=globalThis.ReceizOfflineVerifier;let result;
 if(file.name==='record.json')result=await v.inspectWalletCapsule(JSON.parse(new TextDecoder().decode(bytes)).details?.proofBundle);
 else{result=await v.inspectArtifact(bytes,file.name);if(expected&&result.artifactSha256!==expected)throw Error('SELECTED_RECORD_DIGEST_MISMATCH');}
 output.textContent=JSON.stringify(result,null,2);
 }catch(error){output.textContent=error.message;}}
 </script></html>
